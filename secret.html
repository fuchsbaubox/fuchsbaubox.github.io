<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEHEIMER FUCHSBAU | SPECIAL OFFER</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial Black', sans-serif; /* Etwas fetter für den Secret-Vibe */
      color: white;
      text-align: center;
      padding: 10px;
      overflow-x: hidden;
      background-color: #ffaed5;
      animation: slowPinkPulse 20s infinite alternate ease-in-out;
    }

    @keyframes slowPinkPulse {
      0% { background-color: #ffaed5; }
      100% { background-color: #ff007f; }
    }

    /* SECRET HINWEIS */
    .secret-banner {
      background: black;
      color: #ffaed5;
      padding: 10px;
      font-size: 14px;
      letter-spacing: 2px;
      border-bottom: 2px solid white;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .header-logo img {
      width: 90%;
      max-width: 500px;
      filter: drop-shadow(0 0 15px rgba(255,255,255,0.5));
    }

    /* PREIS-STYLING (GRAFFITI) */
    .price-container {
      margin: 30px 0;
      position: relative;
      display: inline-block;
    }

    .old-price {
      font-size: 24px;
      color: black;
      text-decoration: line-through;
      text-decoration-color: red;
      text-decoration-thickness: 4px;
      opacity: 0.6;
    }

    .new-price {
      display: block;
      font-size: 50px;
      color: red;
      font-family: 'Courier New', Courier, monospace; /* Wirkt wie gesprüht/getippt */
      font-weight: bold;
      transform: rotate(-5deg); /* Schräger Graffiti-Look */
      text-shadow: 2px 2px 0px black;
      margin-top: -10px;
    }

    .new-price::after {
      content: "!!!";
      font-size: 30px;
    }

    /* BUTTONS */
    .buy-btn {
      background-color: black;
      color: #ffaed5;
      border: 4px solid white;
      padding: 20px 40px;
      font-size: 28px;
      border-radius: 0; /* Industrial: eckig statt rund */
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    .buy-btn:hover {
      transform: scale(1.1) rotate(2deg);
      background: #ffaed5;
      color: black;
    }

    .images img {
      width: 80%;
      max-width: 400px;
      border: 3px solid black;
      margin: 10px;
    }
  </style>
</head>
<body>

<div class="secret-banner">
    🦊 GLÜCKWUNSCH! DU HAST DEN GEHEIMEN FUCHSBAU GEFUNDEN 🦊
</div>

<div id="main-content">
    <div class="header-logo">
        <img src="logo.png" alt="FUCHSBAUBOX">
    </div>

    <p style="color: black; font-weight: bold; margin-top: 20px;">EXKLUSIVER COMMUNITY-PREIS:</p>

    <div class="price-container">
        <span class="old-price">15,99€</span>
        <span class="new-price">10,99€</span>
    </div>

    <br><br>

    <!-- HIER DEINEN NEUEN PAYPAL-LINK EINSETZEN -->
    <a href="DEIN_NEUER_PAYPAL_LINK_HIER" target="_blank" class="buy-btn">
      JETZT SCHNAPPER MACHEN
    </a>

    <div class="images" style="margin-top: 50px;">
        <img src="1.png" alt="Secret Box View">
    </div>

    <p style="color: black; font-size: 12px; margin-top: 40px;">
        Pssst... diesen Link nicht jedem verraten. Nur für echte Füchse.
    </p>
</div>

</body>
</html>
